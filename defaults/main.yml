---

fiozl_script_name: 'gozfs.sh'  # single installer script (handles 512b/4k/8k via -a)
fiozl_end_suffix: completed
fiozl_tmux_tab_name: 'Install_FreeBSD'

fiozl_provider:
  - 'ada0'
#  - 'ada1'
fiozl_swap_partition_size: '512M'
fiozl_zfs_partition_size: ''  # full disk minus {{ fiozl_offset_end_disk }}
fiozl_poolname: 'zroot'
fiozl_ashift_disk: '' # default - '4k'; '8k'; or '512b' (native 512-byte sectors, no gnop)
fiozl_boot_mode: '' # default - 'auto' (auto-detect). Options: auto | bios | uefi | hybrid
fiozl_install_debug: false # -x: also install debug sets (base-dbg, lib32-dbg, kernel-dbg)
fiozl_hostname: '' # default - 'core.domain.com'
fiozl_ftphost: 'http://ftp.freebsd.org/pub/FreeBSD/releases/amd64/12.4-RC2/' # url_dir (12.3)
fiozl_mode: '' # Single disk - stripe
fiozl_distdir: ''
fiozl_destdir: '' # default - '/mnt'
fiozl_timezone: '' # default - 'Europe/Kyiv'
fiozl_memdisksize: '' # default - '350' MB # deprecated
fiozl_offset_end_disk: '' # default - '2048' sectors (~1 MB)
fiozl_iface: '' # autodetected when empty; REQUIRED when fiozl_ip is a static address
fiozl_ip: '' # '' / 'DHCP' / 'auto' / '10.0.0.101/24'
fiozl_nameserver: '' # -N: DNS servers for target system, comma/space separated, e.g. '8.8.8.8,1.1.1.1'
fiozl_url_ssh_key_file:
  - '' # url of a single ssh key file
fiozl_url_ssh_key_dir:
  - '' #  ${url_ssh_key_dir}/key[1..9].pub
fiozl_file_zfs_skeleton: '' # path to a local zfs skeleton file inside the installer
fiozl_url_file_zfs_skeleton: '' # URL fetched to /tmp/zfs_skeleton.sh and executed
fiozl_password: ''  # default mfsroot123
fiozl_gateway: 'auto' # or IP or DHCP
fiozl_reboot_timeout: '300' # seconds

# ZFS native encryption (optional). Creates an extra dataset <pool>/encrypted
# (aes-256-gcm), unlocked at boot via the zfskeys rc service.
fiozl_encryption_mode: '' # '' / 'none' (default), or 'native'
# Literal passphrase. When set (and mode is native) the role uploads it to the
# host (mode 0600) and feeds it to the script via -e. Use ansible-vault!
fiozl_encrypt_passphrase: ''
# Path ON the MfsBSD host to a pre-placed passphrase file. Used when
# fiozl_encrypt_passphrase is empty.
fiozl_encrypt_passphrase_file: ''

# yaml syntax:
# https://yaml-multiline.info/
fiozl_script_options: '
 -p ''{{ fiozl_provider | join("'' -p ''") }}''
 -s ''{{ fiozl_swap_partition_size }}''
 -S ''{{ fiozl_zfs_partition_size }}''
 -n ''{{ fiozl_poolname }}''
 -m ''{{ fiozl_mode }}''
 -d ''{{ fiozl_distdir }}''
 -f ''{{ fiozl_ftphost }}''
 -M ''{{ fiozl_memdisksize }}''
 -P ''{{ fiozl_password }}''
 -h ''{{ fiozl_hostname }}''
 -o ''{{ fiozl_offset_end_disk }}''
 -k ''{{ fiozl_url_ssh_key_file }}''
 -K ''{{ fiozl_url_ssh_key_dir }}''
 -D ''{{ fiozl_destdir }}''
 -g ''{{ fiozl_gateway }}''
 -i ''{{ fiozl_iface }}''
 -I ''{{ fiozl_ip }}''
 -N ''{{ fiozl_nameserver }}''
 -a ''{{ fiozl_ashift_disk }}''
 -B ''{{ fiozl_boot_mode }}''
 -E ''{{ fiozl_encryption_mode }}''
 -t ''{{ fiozl_timezone }}''
 -z ''{{ fiozl_file_zfs_skeleton }}''
 -Z ''{{ fiozl_url_file_zfs_skeleton }}''
{% if fiozl_encrypt_passphrase | length > 0 %} -e ''/root/.zfs_passphrase''{% elif fiozl_encrypt_passphrase_file | length > 0 %} -e ''{{ fiozl_encrypt_passphrase_file }}''{% endif %}
{% if fiozl_install_debug %} -x{% endif %}
'
