---

fiozl_script_name: 'gozfs.sh'  # single installer script (handles 512b/4k/8k via -a)
fiozl_end_suffix: completed
fiozl_tmux_tab_name: 'Install_FreeBSD'

fiozl_provider:
  - 'ada0'
#  - 'ada1'
fiozl_swap_partition_size: '512M'
fiozl_zfs_partition_size: ''  # full disk minus {{ fiozl_offset_end_disk }}
fiozl_poolname: 'zroot'
fiozl_ashift_disk: '' # default - '4k'; '8k'; or '512b' (native 512-byte sectors, no gnop)
fiozl_boot_mode: '' # default - 'auto' (auto-detect). Options: auto | bios | uefi | hybrid
fiozl_install_debug: false # -x: also install debug sets (base-dbg, lib32-dbg, kernel-dbg)
fiozl_hostname: '' # default - 'core.domain.com'
fiozl_ftphost: 'http://ftp.freebsd.org/pub/FreeBSD/releases/amd64/14.4-RELEASE/' # url_dir with base.txz, kernel.txz, ...
fiozl_mode: '' # Single disk - stripe
fiozl_distdir: '' # dir on the MfsBSD host with pre-fetched *.txz (then nothing is downloaded)
fiozl_destdir: '' # default - '/mnt'
fiozl_timezone: '' # default - 'Europe/Kyiv'
fiozl_memdisksize: '' # default - '350' MB # deprecated
fiozl_offset_end_disk: '' # default - '2048' sectors (~1 MB)
fiozl_iface: '' # autodetected when empty; REQUIRED when fiozl_ip is a static address
fiozl_ip: '' # '' / 'DHCP' / 'auto' / '10.0.0.101/24'
fiozl_nameserver: '' # -N: DNS servers for target system, comma/space separated, e.g. '8.8.8.8,1.1.1.1'
# Lists of mirrors: the first URL that can be fetched is used.
fiozl_url_ssh_key_file: [] # urls of an authorized_keys-style file
fiozl_url_ssh_key_dir: [] # urls of a directory with key1.pub .. key9.pub
fiozl_file_zfs_skeleton: '' # path to a local zfs skeleton file inside the installer
fiozl_url_file_zfs_skeleton: '' # URL fetched to /tmp/zfs_skeleton.sh and executed
fiozl_password: ''  # default mfsroot123
fiozl_gateway: 'auto' # 'auto' (keep the live IP/gateway as static config), an IP, or 'DHCP'
fiozl_install_timeout: 3600 # seconds to wait for the installer script
fiozl_reboot_timeout: '300' # seconds to wait for sshd of the installed system
fiozl_reboot_wait: true # wait (from the controller) for port 22 after reboot
fiozl_reboot_wait_host: '' # default - static fiozl_ip, else ansible_host
fiozl_reboot_wait_port: '' # default - 22; ansible_port when waiting on ansible_host

# ZFS native encryption (optional). Creates an extra dataset <pool>/encrypted
# (aes-256-gcm, keylocation=prompt). Unlock after boot: zfs load-key -a && zfs mount -a
fiozl_encryption_mode: '' # '' / 'none' (default), or 'native'
# Literal passphrase. When set (and mode is native) the role uploads it to the
# host (mode 0600) and feeds it to the script via -e. Use ansible-vault!
fiozl_encrypt_passphrase: ''
# Path ON the MfsBSD host to a pre-placed passphrase file. Used when
# fiozl_encrypt_passphrase is empty.
fiozl_encrypt_passphrase_file: ''

# Every value is shell-quoted; the role writes the command line into a 0700
# runner file on the host, so quotes/spaces in values (e.g. password) are safe.
fiozl_script_options: >-
  {% for item in fiozl_provider %} -p {{ item | string | quote }}{% endfor %}
  -s {{ fiozl_swap_partition_size | string | quote }}
  -S {{ fiozl_zfs_partition_size | string | quote }}
  -n {{ fiozl_poolname | string | quote }}
  -m {{ fiozl_mode | string | quote }}
  -d {{ fiozl_distdir | string | quote }}
  -f {{ fiozl_ftphost | string | quote }}
  -M {{ fiozl_memdisksize | string | quote }}
  -P {{ fiozl_password | string | quote }}
  -h {{ fiozl_hostname | string | quote }}
  -o {{ fiozl_offset_end_disk | string | quote }}
  {% for item in ([fiozl_url_ssh_key_file] if fiozl_url_ssh_key_file is string else fiozl_url_ssh_key_file) if item %} -k {{ item | string | quote }}{% endfor %}
  {% for item in ([fiozl_url_ssh_key_dir] if fiozl_url_ssh_key_dir is string else fiozl_url_ssh_key_dir) if item %} -K {{ item | string | quote }}{% endfor %}
  -D {{ fiozl_destdir | string | quote }}
  -g {{ fiozl_gateway | string | quote }}
  -i {{ fiozl_iface | string | quote }}
  -I {{ fiozl_ip | string | quote }}
  -N {{ fiozl_nameserver | string | quote }}
  -a {{ fiozl_ashift_disk | string | quote }}
  -B {{ fiozl_boot_mode | string | quote }}
  -E {{ fiozl_encryption_mode | string | quote }}
  -t {{ fiozl_timezone | string | quote }}
  -z {{ fiozl_file_zfs_skeleton | string | quote }}
  -Z {{ fiozl_url_file_zfs_skeleton | string | quote }}
  {% if fiozl_encryption_mode == 'native' %}{% if fiozl_encrypt_passphrase | length > 0 %} -e /root/.zfs_passphrase{% elif fiozl_encrypt_passphrase_file | length > 0 %} -e {{ fiozl_encrypt_passphrase_file | string | quote }}{% endif %}{% endif %}
  {% if fiozl_install_debug | bool %} -x{% endif %}
