---

- name: Upload main script
  copy:
    src: '{{ fiozl_script_name }}'
    dest: /root/
    mode: '0644'
    # (default) overwrite on source change

- name: Compute effective ZFS passphrase file path
  ansible.builtin.set_fact:
    _fiozl_effective_passphrase_file: >-
      {{ fiozl_encrypt_passphrase_file
         if fiozl_encrypt_passphrase_file | length > 0
         else '/root/.zfs_passphrase' }}
  when:
    - fiozl_encryption_mode == 'native'
    - fiozl_encrypt_passphrase | length > 0

- name: Upload ZFS encryption passphrase
  ansible.builtin.copy:
    content: '{{ fiozl_encrypt_passphrase }}'
    dest: '{{ _fiozl_effective_passphrase_file }}'
    mode: '0600'
    owner: root
    group: wheel
  no_log: true
  when:
    - fiozl_encryption_mode == 'native'
    - fiozl_encrypt_passphrase | length > 0
